name: build-test-deploy

on: push

jobs:
  build:
    runs-on: unbuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v4
      - name: use node.js
        uses: action/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run build
      
  test:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: check out repo
        uses: actions/checkout@v4
      - name: use node.js
        uses: action/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm test
    
